<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vulnerable Records Demo (Error-Based SQLi)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --error: #f87171;
        --ok: #34d399;
        --border: #1f2937;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }
      main {
        width: 100%;
        max-width: 720px;
      }
      h1 { margin-top: 0; }
      .warning {
        background: #7f1d1d;
        color: #fee2e2;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      form, .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      input, textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #0b1220;
        color: var(--text);
        font-size: 1rem;
        font-family: inherit;
      }
      .field { margin-bottom: 1rem; }
      button {
        background: var(--accent);
        color: #0b1220;
        border: 0;
        padding: 0.7rem 1.2rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover { filter: brightness(1.1); }
      .result {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9rem;
      }
      .result.error { background: #3b0d12; border: 1px solid var(--error); color: #fecaca; }
      .result.ok { background: #052e1c; border: 1px solid var(--ok); color: #bbf7d0; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      code { background: #0b1220; padding: 0 0.25rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Records Demo</h1>
      <div class="warning">
        <strong>Educational only.</strong> This app is intentionally vulnerable to
        error-based SQL injection on the <em>comment</em> field. Do not expose it
        to the internet.
      </div>

      <form id="record-form">
        <div class="field">
          <label for="username">Username (safe, parameterized)</label>
          <input id="username" name="username" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="email">Email (safe, parameterized)</label>
          <input id="email" name="email" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="comment">Comment (vulnerable, concatenated)</label>
          <input id="comment" name="comment" required autocomplete="off" />
        </div>
        <button type="submit">Create record</button>
      </form>

      <div id="result" class="result" hidden></div>

      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">
          <strong>Recent records</strong>
          <button type="button" id="refresh" style="background:#1f2937;color:var(--text);">Refresh</button>
        </div>
        <div class="muted" style="margin-bottom:0.75rem;">
          Latest 20 rows from the <code>records</code> table.
        </div>
        <table id="records-table">
          <thead>
            <tr>
              <th>id</th><th>username</th><th>email</th><th>comment</th><th>created_at</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <script>
      const form = document.getElementById('record-form');
      const result = document.getElementById('result');
      const tbody = document.querySelector('#records-table tbody');
      const refreshBtn = document.getElementById('refresh');

      function showResult(payload, ok) {
        result.hidden = false;
        result.className = 'result ' + (ok ? 'ok' : 'error');
        result.textContent = JSON.stringify(payload, null, 2);
      }

      async function loadRecords() {
        try {
          const res = await fetch('/api/records');
          const data = await res.json();
          tbody.innerHTML = '';
          (data.rows || []).forEach((row) => {
            const tr = document.createElement('tr');
            ['id', 'username', 'email', 'comment', 'created_at'].forEach((k) => {
              const td = document.createElement('td');
              td.textContent = row[k] == null ? '' : String(row[k]);
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        } catch (err) {
          console.error(err);
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          comment: document.getElementById('comment').value,
        };
        try {
          const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          showResult(data, res.ok && data.ok);
          if (res.ok) loadRecords();
        } catch (err) {
          showResult({ error: String(err) }, false);
        }
      });

      refreshBtn.addEventListener('click', loadRecords);
      loadRecords();
    </script>
  </body>
</html>
